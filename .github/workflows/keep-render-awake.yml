name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed service health
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 10 --max-time 90 \
            https://online-liquor-land.onrender.com/api/health)"
          echo "$response" | jq --exit-status '.status == "ok"' > /dev/null
          echo "ONLINE LIQUOR LAND health check passed."
